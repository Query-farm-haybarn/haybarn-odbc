# Haybarn: collects the platform zips produced by the ODBC workflow's build
# jobs, generates SHA256SUMS, signs them with GPG, and publishes a GitHub
# Release. Mirrors Query-farm-haybarn/haybarn's haybarn-publish.yml.
#
# Windows code signing (Azure Trusted Signing) is not wired up yet — see the
# NOTE comments in ODBC.yml. Integrity is provided by SHA256SUMS + detached
# GPG signature + GitHub build-provenance attestations (attached per-artifact
# in ODBC.yml itself).
#
# 2.0 line: only haybarn-v2.* tags publish from this file. workflow_run always
# runs the default branch's copy, so while the 1.5 line (`haybarn`) is the
# default branch a 2.0 release goes through workflow_dispatch with
# --ref haybarn-2.0.
name: Haybarn Publish

on:
  # Runs automatically once the ODBC build workflow finishes for a tag push.
  workflow_run:
    workflows: ["ODBC"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ODBC workflow run ID to publish artifacts from'
        type: string
        required: true
      tag:
        description: 'Release tag to publish (e.g. haybarn-v2.0.0.0)'
        type: string
        required: true
      dry_run:
        description: 'Assemble, checksum, sign and check the assets but create no release'
        type: boolean
        default: true

permissions:
  contents: write   # create the GitHub Release
  actions: read     # download artifacts from the triggering run

jobs:
  publish:
    # Only Haybarn 2.x tags; on workflow_run the build must also have succeeded.
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'haybarn-v2.')) ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'haybarn-v2.'))
    runs-on: ubuntu-24.04
    env:
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: haybarn-odbc-*
          path: /tmp/artifacts
          merge-multiple: true

      - name: Collect artifacts and checksums
        shell: bash
        run: |
          mkdir -p release
          find /tmp/artifacts -type f -name '*.zip' -exec cp {} release/ \;
          cd release
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: GPG sign checksums
        shell: bash
        env:
          HAYBARN_GPG_PRIVATE_KEY: ${{ secrets.HAYBARN_GPG_PRIVATE_KEY }}
          HAYBARN_GPG_PASSPHRASE: ${{ secrets.HAYBARN_GPG_PASSPHRASE }}
        run: |
          # GPG import resilience — the org secret's storage shape isn't
          # guaranteed (see Query-farm-haybarn/haybarn's haybarn-publish.yml
          # history). Try every plausible shape in order, importing the
          # FIRST one that gpg accepts.
          set -uo pipefail
          KEYFILE="$(mktemp)"
          trap 'shred -u "$KEYFILE" 2>/dev/null || rm -f "$KEYFILE"' EXIT

          try_import() {
            local label="$1"
            if gpg --batch --import "$KEYFILE" 2>/tmp/gpg.err; then
              echo "✅ imported as: $label"
              return 0
            fi
            echo "✗ $label: $(head -c 200 /tmp/gpg.err)"
            return 1
          }

          # 1. Direct (ASCII-armored, embedded newlines preserved).
          printf '%s\n' "$HAYBARN_GPG_PRIVATE_KEY" > "$KEYFILE"
          if try_import "ascii-armored (direct, $(wc -c <"$KEYFILE") bytes)"; then : ;
          # 2. Literal `\n` escape sequences → real newlines.
          elif printf '%s' "$HAYBARN_GPG_PRIVATE_KEY" | sed $'s/\\\\n/\\\n/g' > "$KEYFILE" && try_import "armored with \\n escape sequences ($(wc -c <"$KEYFILE") bytes)"; then : ;
          # 3. Base64 (no framing) → binary key.
          elif printf '%s' "$HAYBARN_GPG_PRIVATE_KEY" | tr -d '[:space:]' | base64 -d > "$KEYFILE" 2>/dev/null && [ -s "$KEYFILE" ] && try_import "base64-decoded ($(wc -c <"$KEYFILE") bytes)"; then : ;
          # 4. Base64 of armored text (one-line "safe paste" pattern).
          elif printf '%s' "$HAYBARN_GPG_PRIVATE_KEY" | tr -d '[:space:]' | base64 -d 2>/dev/null > "$KEYFILE" && head -c 5 "$KEYFILE" | grep -q '^-----' && try_import "base64-of-armored ($(wc -c <"$KEYFILE") bytes)"; then : ;
          # 5. Hex-encoded binary.
          elif printf '%s' "$HAYBARN_GPG_PRIVATE_KEY" | tr -d '[:space:]' | xxd -r -p > "$KEYFILE" 2>/dev/null && [ -s "$KEYFILE" ] && try_import "hex-decoded ($(wc -c <"$KEYFILE") bytes)"; then : ;
          # 6. Raw bytes (last resort).
          elif printf '%s' "$HAYBARN_GPG_PRIVATE_KEY" > "$KEYFILE" && try_import "raw-bytes ($(wc -c <"$KEYFILE") bytes)"; then : ;
          else
            v="$HAYBARN_GPG_PRIVATE_KEY"
            total=${#v}
            echo "----- Cannot decode HAYBARN_GPG_PRIVATE_KEY. Diagnostic profile (counts only): -----"
            count_class() {
              local label="$1" re="$2"
              printf '%s' "$v" | tr -cd "$re" | wc -c | awk -v l="$label" -v t="$total" '{printf "  %-25s %d / %d (%.1f%%)\n", l, $1, t, ($1*100.0/t)}'
            }
            echo "  total bytes:              $total"
            count_class "dashes (-)"          '-'
            count_class "equals (=)"          '='
            count_class "uppercase A-Z"       'A-Z'
            count_class "lowercase a-z"       'a-z'
            count_class "digits 0-9"          '0-9'
            count_class "hex chars [0-9a-f]"  '0-9a-f'
            count_class "+/* (base64 extras)" '+/*'
            count_class "newlines (\\n)"      '\n'
            count_class "carriage returns"    '\r'
            count_class "spaces"              ' '
            count_class "backslashes"         '\\'
            echo "  first byte (hex):         $(printf '%s' "$v" | head -c 1 | xxd -p)"
            echo "  last byte (hex):          $(printf '%s' "$v" | tail -c 1 | xxd -p)"
            echo "  contains '\\n' literal:    $(printf '%s' "$v" | grep -c '\\n' || true)"
            echo "  starts with -----:         $(printf '%s' "$v" | head -c 5 | grep -cF -- '-----' || true)"
            echo "-----------------------------------------------------------------------------------"
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$HAYBARN_GPG_PASSPHRASE" \
            --armor --detach-sign --output release/SHA256SUMS.asc release/SHA256SUMS

      # Exactly one zip per ODBC.yml platform leg, the checksums and their
      # signature; nothing named after DuckDB.
      - name: Check release assets
        shell: bash
        run: |
          set -euo pipefail
          expected="SHA256SUMS
          SHA256SUMS.asc
          haybarn_odbc-linux-amd64.zip
          haybarn_odbc-linux-arm64.zip
          haybarn_odbc-macos-amd64.zip
          haybarn_odbc-macos-arm64.zip
          haybarn_odbc-windows-amd64.zip
          haybarn_odbc-windows-arm64.zip"
          actual=$(cd release && find . -type f | sed 's|^\./||' | LC_ALL=C sort)
          diff <(printf '%s\n' "$expected" | sed 's/^ *//') <(printf '%s\n' "$actual")
          (cd release && sha256sum -c SHA256SUMS)
          gpg --batch --verify release/SHA256SUMS.asc release/SHA256SUMS

      - name: Upload dry-run assets
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: haybarn-odbc-release-dry-run
          path: release/

      # The org enforces immutable releases: assets must be attached while the
      # release is a draft, so create it as a draft, upload, check, publish.
      # workflow_run has no inputs, so it always publishes.
      - name: Create GitHub Release
        if: inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PRERELEASE=
          case "$TAG" in *-rc*|*-dev*) PRERELEASE=--prerelease ;; esac
          cat > notes.md <<'NOTES'
          Haybarn ODBC driver — powered by DuckDB.

          An independent derived distribution of DuckDB. Not affiliated with or
          endorsed by the DuckDB Foundation. DuckDB is a trademark of the
          DuckDB Foundation.

          ## Verifying downloads
          - `SHA256SUMS` — checksums for every artifact.
          - `SHA256SUMS.asc` — detached GPG signature of `SHA256SUMS`.
          - GitHub build attestations — SLSA provenance binding each artifact
            to the commit, workflow, and run that built it.

          ```
          sha256sum -c SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
          gh attestation verify <file> --repo Query-farm-haybarn/haybarn-odbc
          ```
          NOTES
          if find release -iname '*duckdb*' | grep .; then
            echo "refusing to publish duckdb-named assets" >&2
            exit 1
          fi
          expected=$(find release -type f | wc -l)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft $PRERELEASE \
            --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release/*
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          test "$count" -eq "$expected"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          test "$count" -eq "$expected"
