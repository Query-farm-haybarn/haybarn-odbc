name: ODBC
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
        override_git_describe:
            description: 'Override git describe'
            required: false
  workflow_call:
  repository_dispatch:

permissions:
  id-token: write       # OIDC for build-provenance attestation signing
  attestations: write   # write to the GitHub attestations API
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  OVERRIDE_GIT_DESCRIBE: ${{ inputs.override_git_describe }}

jobs:
  odbc-linux-amd64:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    env:
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref }}

      - name: Cache Key
        id: cache_key
        run: |
          DUCKDB_VERSION=$(python ./scripts/print_duckdb_version.py)
          KEY="${{ runner.os }}-${{ runner.arch }}-$DUCKDB_VERSION"
          echo "value=${KEY}" >> "${GITHUB_OUTPUT}"

      - name: Restore Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ steps.cache_key.outputs.value }}

      - name: Enforce jemalloc
        working-directory: src/duckdb
        run: |
          patch -p1 < ${{ github.workspace }}/local/vendoring/jemalloc_enforce.patch
          git diff HEAD

      - name: Build
        run: |
          docker run                   \
          -v.:/duckdb                  \
          -e GEN=ninja                 \
          -e CC='ccache gcc'           \
          -e CXX='ccache g++'          \
          -e CCACHE_DIR=/duckdb/ccache \
          ${{ env.MANYLINUX_IMAGE }}   \
          bash -c "
            set -e
            cat /etc/os-release
            dnf install -y           \
              ccache                 \
              ninja-build            \
              unixODBC-devel
            make -C /duckdb release
          "
    
      - name: Save Cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ steps.cache_key.outputs.value }} 

      - name: List Symbols
        run: |
          nm -gU ./build/release/libhaybarn_odbc.so

      - name: ODBC Tests
        if: ${{ inputs.skip_tests != 'true' }}
        run: |
          docker run                 \
          -v.:/duckdb                \
          ${{ env.MANYLINUX_IMAGE }} \
          bash -c "
            set -e
            cat /etc/os-release
            dnf install -y \
              unixODBC-devel
            /duckdb/build/release/test/test_odbc
          "

      - name: Package
        run: |
          zip -j haybarn_odbc-linux-amd64.zip build/release/libhaybarn_odbc.so linux_setup/unixodbc_setup.sh linux_setup/update_odbc_path.py

      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/haybarn-v')
        with:
          subject-path: haybarn_odbc-linux-amd64.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: haybarn-odbc-linux-amd64
          path: |
            haybarn_odbc-linux-amd64.zip

  odbc-linux-aarch64:
    name: Linux (aarch64)
    runs-on: ubuntu-24.04-arm
    needs: odbc-linux-amd64
    env:
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_aarch64
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref }}

      - name: Cache Key
        id: cache_key
        run: |
          DUCKDB_VERSION=$(python ./scripts/print_duckdb_version.py)
          KEY="${{ runner.os }}-${{ runner.arch }}-$DUCKDB_VERSION"
          echo "value=${KEY}" >> "${GITHUB_OUTPUT}"

      - name: Restore Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ steps.cache_key.outputs.value }}

      - name: Build
        shell: bash
        run: |
          docker run                   \
          -v.:/duckdb                  \
          -e GEN=ninja                 \
          -e CC='ccache gcc'           \
          -e CXX='ccache g++'          \
          -e CCACHE_DIR=/duckdb/ccache \
          ${{ env.MANYLINUX_IMAGE }}   \
          bash -c "
            set -e
            cat /etc/os-release
            dnf install -y           \
              ccache                 \
              ninja-build            \
              unixODBC-devel
            make -C /duckdb release
          "

      - name: Save Cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ steps.cache_key.outputs.value }}

      - name: List Symbols
        run: |
          nm -gU ./build/release/libhaybarn_odbc.so

      - name: ODBC Tests
        shell: bash
        if: ${{ inputs.skip_tests != 'true' }}
        run: |
          docker run                 \
          -v.:/duckdb                \
          ${{ env.MANYLINUX_IMAGE }} \
          bash -c "
            set -e
            cat /etc/os-release
            dnf install -y \
              unixODBC-devel
            /duckdb/build/release/test/test_odbc
          "

      - name: Package
        shell: bash
        run: |
          zip -j haybarn_odbc-linux-arm64.zip build/release/libhaybarn_odbc.so linux_setup/unixodbc_setup.sh linux_setup/update_odbc_path.py

      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/haybarn-v')
        with:
          subject-path: haybarn_odbc-linux-arm64.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: haybarn-odbc-linux-arm64
          path: |
            haybarn_odbc-linux-arm64.zip

  odbc-windows-amd64:
    name: Windows (amd64)
    runs-on: windows-latest
    needs: odbc-linux-amd64
    env:
      CC: 'ccache cl'
      CXX: 'ccache cl'
      CCACHE_DIR: ${{ github.workspace }}/ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref }}

      - name: Dependencies
        shell: bash
        run: |
          choco install \
            ccache \
            wget \
            zip \
            -y --force --no-progress

      - name: Cache Key
        id: cache_key
        shell: bash
        run: |
          DUCKDB_VERSION=$(python ./scripts/print_duckdb_version.py)
          KEY="${{ runner.os }}-${{ runner.arch }}-$DUCKDB_VERSION"
          echo "value=${KEY}" >> "${GITHUB_OUTPUT}"

      - name: Restore Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ steps.cache_key.outputs.value }}

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          mkdir build
          cd build
          mkdir release
          cd release
          cmake ../.. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Save Cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ steps.cache_key.outputs.value }} 

      - name: List Symbols
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          dumpbin.exe /imports build\release\bin\haybarn_odbc.dll
          dumpbin.exe /exports build\release\bin\haybarn_odbc.dll

      - name: Setup ODBC
        shell: bash
        run: |
          ./build/release/bin/odbc_install.exe //CI //Install
          Reg Query "HKLM\SOFTWARE\ODBC\ODBC.INI\ODBC Data Sources"
          Reg Query "HKLM\SOFTWARE\ODBC\ODBC.INI\Haybarn"
          Reg Query "HKLM\SOFTWARE\ODBC\ODBCINST.INI\Haybarn Driver"

      - name: Enable ODBC Trace HKCU
        shell: bash
        run: |
          REG ADD "HKCU\SOFTWARE\ODBC\ODBC.INI\ODBC" //f
          REG ADD "HKCU\SOFTWARE\ODBC\ODBC.INI\ODBC" //v Trace //t REG_SZ //d 1
          REG ADD "HKCU\SOFTWARE\ODBC\ODBC.INI\ODBC" //v TraceDll //t REG_SZ //d "C:\Windows\system32\odbctrac.dll"
          REG ADD "HKCU\SOFTWARE\ODBC\ODBC.INI\ODBC" //v TraceFile //t REG_SZ //d "D:\a\haybarn-odbc\haybarn-odbc\ODBC_TRACE.log"
          echo "----------------------------------------------------------------"
          Reg Query "HKCU\SOFTWARE\ODBC\ODBC.INI\ODBC"

      - name: Test Standard ODBC tests
        if: ${{ inputs.skip_tests != 'true' }}
        shell: bash
        run: |
          ./build/release/bin/test_odbc.exe

      - name: Test Standard ODBC tests with VS2019 C++ stdlib
        if: ${{ inputs.skip_tests != 'true' }}
        shell: bash
        run: |
          wget -P build/release/bin https://blobs.duckdb.org/ci/msvcp140.dll
          ./build/release/bin/test_odbc.exe
          rm build/release/bin/msvcp140.dll

      - name: Test PyODBC
        if: ${{ inputs.skip_tests != 'true' }}
        shell: bash
        run: |
          pip install pyodbc
          python ./test/pyodbc-test.py

      - name: Setup Register For Connection Tests
        shell: bash
        run: |
          python ./scripts/create_ini_reg.py
          echo "----------------------------------------------------------------"
          Reg Query "HKCU\SOFTWARE\ODBC\ODBC.INI\Haybarn"

      - name: Test Connection ODBC tests
        if: ${{ inputs.skip_tests != 'true' }}
        shell: bash
        run: |
          ./build/release/bin/test_connection_odbc.exe

      - name: Print ODBC trace on failure
        if: ${{ failure() }}
        shell: bash
        run: cat ODBC_TRACE.log

      # NOTE: Windows code signing (Azure Trusted Signing) is intentionally not
      # wired up yet. Add a signing step here over the built haybarn_odbc.dll /
      # haybarn_odbc_setup.dll / odbc_install.exe when AZURE_CODESIGN_* secrets
      # are available. Binaries ship with SHA256SUMS + GPG signature instead.

      - name: Package
        shell: bash
        run: |
          zip -j haybarn_odbc-windows-amd64.zip        \
            ./build/release/bin/haybarn_odbc.dll       \
            ./build/release/bin/haybarn_odbc_setup.dll \
            ./build/release/bin/odbc_install.exe

      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/haybarn-v')
        with:
          subject-path: haybarn_odbc-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: haybarn-odbc-windows-amd64
          path: |
            haybarn_odbc-windows-amd64.zip

  odbc-windows-arm64:
    name: Windows (aarch64)
    runs-on: windows-11-arm
    needs: odbc-linux-amd64
    env:
